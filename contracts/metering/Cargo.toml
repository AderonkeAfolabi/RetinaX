[package]
name = "metering"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[test]]
name = "init_test"
path = "tests/init_test.rs"

[[test]]
name = "validation_test"
path = "tests/validation_test.rs"

[[test]]
name = "quota_boundary_test"
path = "tests/quota_boundary_test.rs"

[[test]]
name = "billing_rollover_test"
path = "tests/billing_rollover_test.rs"

[dependencies]
soroban-sdk = { workspace = true }
retinax-common = { path = "../common", package = "common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
