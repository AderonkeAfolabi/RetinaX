[package]
name = "vision_records"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[test]]
name = "property"
path = "tests/property/main.rs"

[[test]]
name = "consent_management_test"
path = "tests/consent_management_test.rs"

[dependencies]
soroban-sdk = { workspace = true, features = ["alloc"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
teye-common = { path = "../common", package = "common", features = ["std", "full"] }
soroban-sdk = { workspace = true }
retinax-common = { path = "../common", package = "common", features = ["std", "full"] }
audit = { path = "../audit" }
clinical_records = { path = "../clinical_records" }
key_manager = { path = "../key_manager" }
access_control = { path = "../access_control" }

[target.'cfg(target_family = "wasm")'.dependencies]
teye-common = { path = "../common", package = "common", features = ["full"] }
audit = { path = "../audit", features = ["library"] }
clinical_records = { path = "../clinical_records", features = ["library"] }
key_manager = { path = "../key_manager", features = ["library"] }
access_control = { path = "../access_control", features = ["library"] }
[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = { workspace = true }
proptest-derive = { workspace = true }
ed25519-dalek = "2.1"

[features]
testutils = ["soroban-sdk/testutils"]
