name: Markdown Link Check

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'lychee.toml'
      - '.github/workflows/markdown-links.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'lychee.toml'
      - '.github/workflows/markdown-links.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdown-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Check Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml '**/*.md'
          fail: true
          format: markdown
